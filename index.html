<!doctype html>
<html lang="sk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mario Dak - Portfolio</title>

    <link rel="stylesheet" href="assets/css/styles.css" />

    <style>
    </style>
</head>

<body>

    <div id="main-content">
        <div class="page-wrapper">

            <div class="mytitle">MARIO DAK</div>

            <div id="site-loader">
                <div class="loader-row">
                    <span class="status-icon">[LOADING ENGINE]</span>
                    <span id="terminal-output">INITIALIZING...</span>
                    <span id="loader-percentage">0%</span>
                </div>
            </div>

            <div class="portfolio-frame">
                <div class="inner-mask"></div>

                <div class="content-inside">
                    <header>
                        <nav class="portfolio-nav">
                            <div class="active-indicator-mobile">
                                <a href="#" class="active-link" data-text="HOME">HOME</a>
                            </div>

                            <div class="nav-links-container" id="main-nav-links">
                                <a href="#" data-text="About Me" class="active-link"
                                    data-file="assets/pages/aboutme.html">About Me</a>

                                <a href="#" data-text="Art style" data-file="assets/pages/artstyle.html">Art style</a>
                                <a href="#" data-text="Projects" data-file="assets/pages/projects.html">Projects</a>
                                <a href="#" data-text="Gallery" data-file="assets/pages/gallery.html">Gallery</a>
                                <a href="#" data-text="Contact" data-file="assets/pages/contact.html">Contact</a>
                            </div>

                            <div class="hamburger-menu" id="mobile-toggle">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </nav>
                    </header>

                    <section id="main-section">
                    </section>
                </div>
            </div>
        </div>

        <footer>
            @ Copyright Mario Dak 2026
        </footer>
    </div>

    <script>
        // Všetko staré odtiaľto vyhadzujeme, lebo sa to bilo s main.js routerom!
        window.addEventListener('DOMContentLoaded', () => {
            const mainContent = document.getElementById('main-content');
            if (mainContent) {
                mainContent.classList.add('fade-in-active');
            }
        });
    </script>

    <script src="assets/scripts/main.js" defer></script>
    <script src="assets/scripts/vanilla.js" defer></script>

</body>

</html>
